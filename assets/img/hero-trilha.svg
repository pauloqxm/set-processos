  <g>
    <rect x="2" y="151" width="76" height="34" rx="8" fill="#E8322B"/>
    <text x="40" y="165" text-anchor="middle" font-family="Montserrat,system-ui,sans-serif" font-size="8" font-weight="800" fill="#fff">FIM DO</text>
    <text x="40" y="176" text-anchor="middle" font-family="Montserrat,system-ui,sans-serif" font-size="8" font-weight="800" fill="#fff">PROCESSO</text>
